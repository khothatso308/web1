<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Now - Cathy's Cakes</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

    <header>
        <div class="container header-container">
            <div class="logo">
                <img src="IMAGES\cathys cakes logo.png" alt="Cathy's Cakes Logo" width="80">
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">HOME</a></li>
                    <li><a href="aboutus.html">ABOUT US</a></li>
                    <li><a href="productsgallery.html">PRODUCTS GALLERY</a></li>
                    <li><a href="CONTACT US.html">CONTACT US</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="order-section">
            <h2>ORDER YOUR CAKE</h2>
            <form class="order-form">
                <div class="form-group">
                    <label>CAKE TYPE</label>
                    <select>
                        <option>Select Type</option>
                        <option>Custom Cake</option>
                        <option>Cupcakes</option>
                        <option>Cakepops</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>QUANTITY</label>
                    <input type="number" min="1" value="1">
                </div>
                <div class="form-group">
                    <label>FLAVOUR</label>
                    <select>
                        <option>Select Flavour</option>
                        <option>Vanilla</option>
                        <option>Chocolate</option>
                        <option>Red Velvet</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>DATE OF COLLECTION</label>
                    <input type="date">
                </div>
                <div class="form-group">
                    <label>THEME</label>
                    <input type="text" placeholder="e.g., Birthday, Wedding">
                </div>
                <div class="form-group">
                    <label>ADDITIONAL REQUIREMENTS</label>
                    <textarea rows="3" placeholder="Enter special instructions..."></textarea>
                </div>
            </form>
        </section>
    </main>

    <footer class="footer">
        <div class="container footer-content">
            <div class="footer-logo">Cathy's</div>
            <p>Cathy's Cakes; 2026. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
